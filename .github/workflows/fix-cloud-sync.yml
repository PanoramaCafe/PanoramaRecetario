name: Fix Recetario cloud sync

on:
  push:
    paths:
      - 'sync-fix-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove invalid Bearer header for publishable key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Authorization: "Bearer " + CLOUD_KEY,\n'
          if old not in s:
              raise SystemExit('Expected sync header not found')
          s = s.replace(old, '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix Supabase publishable key header'
          git push
