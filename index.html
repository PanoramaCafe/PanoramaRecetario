<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <title>Panorama Recetario</title>
</head>
<body style="margin:0;background:#fcfbf9;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <div id="boot" style="padding:2rem;color:#1c1917">Cargando Panorama Recetario…</div>
  <script>
  (async function(){
    const boot=document.getElementById('boot');
    try{
      const source='https://raw.githubusercontent.com/PanoramaCafe/PanoramaRecetario/cfbfd9f74e1110b51b3747e8ec41c093e2d7e9b2/index.html';
      const response=await fetch(source,{cache:'no-store'});
      if(!response.ok) throw new Error('No se pudo cargar la aplicación base.');
      let html=await response.text();

      const fixedCost = `function getInsumoUnitCost(ins) {
      if (!ins) return 0;
      if (ins.costoModo === 'directo' && isFinite(Number(ins.costoDirecto))) return Number(ins.costoDirecto) || 0;
      const target = unitFactorToBase(ins.unidadBase || ins.unidadUso || ins.unit);
      const purchasePrice = Number(ins.precioCompraPresentacion ?? ins.costoCompra ?? ins.purchasePrice) || 0;
      const contentQty = Number(ins.purchaseContentQty ?? ins.contenidoPresentacion ?? ins.contenido ?? 0) || 0;
      const contentUnit = ins.purchaseContentUnit || ins.unidadCompra || '';
      const content = unitFactorToBase(contentUnit);
      const units = Number(ins.purchaseUnitsPerPresentation ?? ins.unidadesPorCompra ?? ins.purchaseUnitQty ?? ins.unitsPerPurchase) || 0;
      const storedCost = Number(ins.costoPorUnidadUso);
      const aprovechamiento = Math.max(0.0001, Math.min(1, (Number(ins.aprovechamiento ?? (100 - Number(ins.merma || 0)))) / 100));
      if (purchasePrice > 0 && contentQty > 0 && units > 0 && content && target && content.kind === target.kind) {
        const totalTargetUnits = units * contentQty * content.factor / target.factor;
        if (totalTargetUnits > 0) return (purchasePrice / totalTargetUnits) / aprovechamiento;
      }
      if (purchasePrice > 0 && storedCost > 0 && target && (target.kind === 'vol' || target.kind === 'mass')) {
        const ratio = purchasePrice / storedCost;
        const rounded = Math.round(ratio);
        if (rounded >= 1 && rounded <= 1000 && Math.abs(ratio - rounded) < 0.02) {
          const assumedPresentationUnits = 1000 / target.factor;
          const cost = purchasePrice / (rounded * assumedPresentationUnits);
          if (isFinite(cost) && cost > 0) return cost / aprovechamiento;
        }
      }
      if (isFinite(storedCost) && storedCost > 0) return storedCost / aprovechamiento;
      const purchase = Number(ins.costoCompra) || 0;
      const contenido = Number(ins.contenidoPresentacion || ins.contenido || 0);
      const unidades = Math.max(1, Number(ins.unidadesPorCompra || ins.unitsPerPurchase || 1));
      const factor = Number(ins.factor) || ((String(ins.unidadCompra || '').toLowerCase() === 'kg' || String(ins.unidadCompra || '').toLowerCase() === 'l') ? 1000 : 1);
      const base = contenido > 0 ? purchase / (unidades * contenido * factor) : purchase / (unidades * factor);
      return base / aprovechamiento;
    }`;

      html=html.replace(/function getInsumoUnitCost\(ins\) \{[\\s\\S]*?\n    \}/,fixedCost);

      html=html.replace(
        `function addIngredientToCurrentRecipe(event) {\n      if (event && typeof event.preventDefault === 'function') event.preventDefault();\n      const select = document.getElementById('rec-select-insumo');`,
        `function addIngredientToCurrentRecipe(event) {\n      if (window.__recetarioAddingIngredient) return false;\n      window.__recetarioAddingIngredient = true;\n      if (event && typeof event.preventDefault === 'function') event.preventDefault();\n      const select = document.getElementById('rec-select-insumo');`
      );

      html=html.replace(
        `      if (qtyInput) qtyInput.value = '';\n      renderRecipeIngredientsTable();\n      updateSelectedInsumoInfo();\n      return false;\n    }`,
        `      if (qtyInput) qtyInput.value = '';\n      renderRecipeIngredientsTable();\n      updateSelectedInsumoInfo();\n      window.setTimeout(function(){ window.__recetarioAddingIngredient = false; }, 120);\n      return false;\n    }`
      );

      html=html.replace(
        `        if (select) select.focus();\n        return false;\n      }\n      if (!Number.isFinite(cantidad) || cantidad <= 0) {`,
        `        if (select) select.focus();\n        window.__recetarioAddingIngredient = false;\n        return false;\n      }\n      if (!Number.isFinite(cantidad) || cantidad <= 0) {`
      );
      html=html.replace(
        `        if (qtyInput) qtyInput.focus();\n        return false;\n      }\n\n      const existing`,
        `        if (qtyInput) qtyInput.focus();\n        window.__recetarioAddingIngredient = false;\n        return false;\n      }\n\n      const existing`
      );

      document.open();
      document.write(html);
      document.close();
    }catch(error){
      boot.innerHTML='<h2 style="margin-bottom:.5rem">No se pudo cargar Panorama Recetario</h2><p>'+String(error.message||error)+'</p><p style="color:#78716c">Comprueba tu conexión y vuelve a abrir la app.</p>';
    }
  })();
  </script>
</body>
</html>
