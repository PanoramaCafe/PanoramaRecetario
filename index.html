<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1c1917">
  <meta name="robots" content="noindex">
  <title>Panorama Recetario</title>
</head>
<body style="margin:0;background:#fcfbf9;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;">
  <div id="app-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:700;">Cargando Panorama Recetario…</div>
  <script>
    (async function () {
      // Conservamos la aplicación completa en un commit inmutable y usamos este
      // archivo como punto de entrada estable para GitHub Pages.
      const SOURCE = 'https://raw.githubusercontent.com/PanoramaCafe/PanoramaRecetario/d9779bfd644cc90649d6f670930879bdf0fc6ce6/index.html';
      try {
        const response = await fetch(SOURCE, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();

        // BUG CORREGIDO: el archivo fuente tenía el onclick inline del botón
        // + un segundo addEventListener para el mismo botón. El primer handler
        // agregaba el ingrediente y limpiaba la cantidad; el segundo se ejecutaba
        // inmediatamente después, veía 0 y mostraba la falsa alerta de cantidad.
        html = html.replace(/\n\s*\/\/ Refuerzo: el bot[oó]n de a[ñn]adir tambi[eé]n funciona[\s\S]*?const qty = document\.getElementById\('rec-cant-insumo'\);[\s\S]*?\}\);\n\s*\}\);/m, '\n    });');

        // Protección adicional contra doble toque/eventos duplicados en Safari.
        html = html.replace(
          'function addIngredientToCurrentRecipe(event) {',
          'function addIngredientToCurrentRecipe(event) {\n      if (window.__addingIngredientLock) return false;\n      window.__addingIngredientLock = true;\n      setTimeout(function(){ window.__addingIngredientLock = false; }, 250);'
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const box = document.getElementById('app-loading');
        if (box) box.innerHTML = 'No se pudo cargar Panorama Recetario. Cierra esta pestaña y vuelve a abrirla.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
