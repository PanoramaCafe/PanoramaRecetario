<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1917"><title>Panorama Recetario</title></head><body><div id="boot" style="font-family:system-ui;padding:2rem">Cargando Panorama Recetario…</div><script>(async()=>{const boot=document.getElementById('boot');try{const r=await fetch('./page.html.gz?v=4',{cache:'no-store'});if(!r.ok)throw new Error('No se encontró page.html.gz (HTTP '+r.status+')');const text=await r.text();const clean=text.replace(/\s+/g,'');let raw;if(clean.startsWith('H4sI')){const bin=atob(clean);raw=Uint8Array.from(bin,c=>c.charCodeAt(0))}else{const buf=new Uint8Array(await (await fetch('./page.html.gz?v=4',{cache:'no-store'})).arrayBuffer());raw=buf}let html;if(raw.length>=2&&raw[0]===31&&raw[1]===139){if(!('DecompressionStream' in window))throw new Error('Safari no soporta la descompresión necesaria. Actualiza Safari.');const ds=new DecompressionStream('gzip');html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text()}else{html=new TextDecoder().decode(raw)}if(!html.trim().startsWith('<'))throw new Error('El archivo de la aplicación llegó en un formato no reconocido.');document.open();document.write(html);document.close()}catch(e){boot.innerHTML='<h2 style="margin-bottom:.5rem">No se pudo cargar Panorama Recetario</h2><p>'+String(e.message||e)+'</p><p style="margin-top:1rem;font-size:.9rem;color:#666">Cierra esta pestaña y abre nuevamente el enlace de Panorama Recetario.</p>'}})();</script></body></html>
