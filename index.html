<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<meta name="robots" content="noindex">
<title>Panorama Recetario</title>
<style>html,body{margin:0;background:#fcfbf9;color:#1c1917;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}#app-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:700}</style>
</head>
<body>
<div id="app-loading">Cargando Panorama Recetario…</div>
<script>
(async function(){
  const SOURCE='https://raw.githubusercontent.com/PanoramaCafe/PanoramaRecetario/d9779bfd644cc90649d6f670930879bdf0fc6ce6/index.html';
  const RUNTIME='https://raw.githubusercontent.com/PanoramaCafe/PanoramaRecetario/main/js/runtime.js';
  try{
    const [sourceResponse,runtimeResponse]=await Promise.all([
      fetch(SOURCE,{cache:'no-store'}),
      fetch(RUNTIME,{cache:'no-store'})
    ]);
    if(!sourceResponse.ok)throw new Error('Fuente HTTP '+sourceResponse.status);
    if(!runtimeResponse.ok)throw new Error('Runtime HTTP '+runtimeResponse.status);
    const html=await sourceResponse.text();
    const runtime=await runtimeResponse.text();
    new Function(runtime)();
    const built=window.__panoramaBuild(html);
    const finalHtml=built.replace('</body>',window.__panoramaSyncScript()+'\n</body>');
    document.open();document.write(finalHtml);document.close();
  }catch(error){
    console.error('Panorama Recetario:',error);
    const box=document.getElementById('app-loading');
    if(box)box.innerHTML='No se pudo cargar Panorama Recetario. Cierra esta pestaña y vuelve a abrirla.';
  }
})();
</script>
</body>
</html>
