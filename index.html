<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1917"><title>Panorama Recetario</title></head><body><div id="boot" style="font-family:system-ui;padding:2rem">Cargando Panorama Recetario…</div><script>(async()=>{const boot=document.getElementById('boot');try{const r=await fetch('./page.html.gz?loader=3',{cache:'no-store'});if(!r.ok)throw new Error('No se encontró page.html.gz (HTTP '+r.status+')');const buf=new Uint8Array(await r.arrayBuffer());let html;if(buf.length>=2&&buf[0]===31&&buf[1]===139){if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([buf]).stream().pipeThrough(ds)).text()}else{await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el compresor auxiliar'));document.head.appendChild(s)});html=new TextDecoder().decode(pako.ungzip(buf))}}else{html=new TextDecoder().decode(buf);if(!html.trim().startsWith('<'))throw new Error('El archivo de la aplicación llegó en un formato no reconocido.')}document.open();document.write(html);document.close()}catch(e){boot.innerHTML='<h2 style="margin-bottom:.5rem">No se pudo cargar Panorama Recetario</h2><p>'+String(e.message||e)+'</p><p style="margin-top:1rem;font-size:.9rem;color:#666">Cierra esta pestaña y abre nuevamente el enlace de Panorama Recetario.</p>'}})();</script></body></html>
