<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1917"><title>Panorama Recetario</title></head><body><script>(async()=>{try{const r=await fetch('page.html.gz',{cache:'no-store'});if(!r.ok)throw new Error('Error '+r.status);const t=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close();}catch(e){document.body.innerHTML='<h2 style="font-family:system-ui;padding:2rem">No se pudo cargar Panorama Recetario</h2><p style="font-family:system-ui;padding:0 2rem">'+e.message+'</p>';}})();</script></body></html>
